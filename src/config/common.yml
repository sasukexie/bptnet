# 微表情识别(MER)通用配置文件
## 优先级：*>cmd>init>model.yml>common.yml，*结尾标记最优先
# ==================== 实验基本信息 ====================
base:
  name:                                     # 实验名称, 默认：模型_数据集
  seed: 1024                                # 随机种子（手稿主结果 seeds: 1024/2048/4096）
  base_dir: "saved"                         # 输出根目录
  # 检查点配置
  checkpoint:
    checkpoint_dir: "checkpoints"             # 检查点目录 # 默认在output_dir/{name}/目录下
    save_best_only: True                      # 仅保存最佳模型
    save_last: True                           # 保存最后一个epoch
    resume: null                              # 恢复训练的检查点路径（null表示从头训练）
    keep_folds: False                         # 每折另存 fold_<折号>_<被试>.pth。
                                              # LOSO 一个 run 内逐折都写同一个 best_model.pth
                                              # → 默认只留最后一折的权重；开启后**多种子集成**
                                              # 才有前提（每折保存的权重体积约 120MB/折，
                                              # 24 折约 2.9GB，注意磁盘）。默认关闭。
                                              # [!] 该段需经 run_main.py 的子键级注入才可被
                                              #     BPTNET_CFG 覆盖（见 run_main.py 的说明）。

# ==================== 数据配置 ====================
data:
  data_dir: "dataset"                       # 数据根目录（相对 mer/ 工作区根，即 mer/dataset，多个模型共用以节省空间）
  dataset: "casme2_7c"                      # 数据集：casme2_7c
  cache:                                    # ---- 数据集缓存 ----
    enabled: true                           # 是否启用磁盘缓存
    refresh: false                          # true=强制重新扫描并覆盖缓存（数据集更新或逻辑变更时开启一次）
  fixed_split: [0.8,0.2]                    # train: 0.8, test: 0.2
  split_mode: "fixed"                       # fixed,5fold,loso
  frame_type: "apex"                        # 帧类型: apex(单帧RGB), flow(光流onset→apex), rgb_triplet(三帧堆叠), rgb_flow(RGB+光流onset→apex), rgb_dual_flow(RGB+双向光流onset→apex+apex→offset)
  frame_type_config:
    apex:           { 'channels': 3, 'mode': 'single',     'description': '单帧RGB apex帧' }
    flow:           { 'channels': 2, 'mode': 'single',     'description': 'onset→apex纯光流' }
    rgb_triplet:    { 'channels': 9, 'mode': 'stacked',    'description': 'onset+apex+offset三帧通道堆叠' }
    rgb_flow:       { 'channels': 5, 'mode': 'multimodal', 'is_multimodal': True, 'description': 'RGB apex + onset→apex光流(2-tuple)' }
    rgb_dual_flow:  { 'channels': 7, 'mode': 'multimodal', 'is_multimodal': True, 'is_dual_flow': True, 'description': 'RGB apex + onset→apex光流 + apex→offset光流(3-tuple, 相位感知)' }
  fold_idx:                                 # 0-4
  test_subject:                             # test_subject: sub01
  # 类别平衡配置
  # [!] 2026-09-27 改为 false：手稿 §3.6.1 明确"所有报告数字用 class-weighted CE"，
  #     且主表所有跑批（p21/p23 系列）都显式覆盖 use_focal_loss=false
  #     （实测 focal 在 146 样本上是负资产：megc128 focal 0.7885 vs 关 focal 0.8083）。
  #     若要用 focal，请显式覆盖 {"data":{"use_focal_loss":true}}。
  use_focal_loss: false                     # 手稿 §3.6.1: 报告结果用 class-weighted CE
  focal_gamma: 2.0                          # 仅当 use_focal_loss=true 生效（开发期探索项）
  use_class_weight: true                    # 手稿 §3.6.1: 逆类别频率权重（与 CE 搭配）
#  annotation_data: "combined_3_class2_for_optical_flow.csv"  # 标注文件，默认为data_dir/{annotation_data}
  batch_size: 16                            # 手稿 §3.6.4: batch size = 16
  num_classes: 3                            # 分类数量
  image_size: 64                            # [!] 首轮手稿 §3.6.4 写 224；实测在 ~200 样本下
                                            #   严重过拟合，改 64。手稿需同步修订。
  num_workers: 4                            # 数据加载线程数（配合 persistent_workers=True，
                                            #   进程内图像/光流缓存不会每 epoch 失效）
  pin_memory: True                          # 锁定内存加速
  # ---- 模型选择协议 ----
  # stratified: 从训练被试内部按类别分层抽 val（推荐）
  #   - 单被试 val 只有 ~10 个样本且类别高度不均（实测 Val Acc=1.0 而 UF1=0.333）
  #   - 多被试 val 会把训练数据砍掉约 30%，对小数据集代价过大
  #   - 分层抽样保证 val 的类别比例与全集一致；测试被试始终完全隔离
  val_mode: "stratified"
  val_ratio: 0.2                            # val 占训练池的比例（仅 stratified 模式生效）
  # inner_subject 模式参数（保留备用）
  num_val_subjects: 5                       # 每折留作验证的被试数
  # ---- 数据增强 ----
  # 手稿 §3.6.4 只声明 "Random horizontal flip"；其余增强关闭以对齐手稿，
  # 如需恢复强增强，请同步修改手稿 §3.6.4 的描述。
  augmentation:
    enabled: true                           # 是否打开数据增强
    horizontal_flip: true                   # 随机水平翻转（手稿 §3.6.4）
    rotation_degrees: 0                     # 随机旋转（手稿未声明 → 关闭）
    color_jitter: 0.0                       # 颜色抖动（手稿未声明 → 关闭）
    random_erasing: 0.0                     # 随机擦除（手稿未声明 → 关闭）
  mixup:
    alpha: 0.3                              # [!] 首轮手稿 §3.6.3 写 1.0；α=1.0 在 ~200 样本下
                                            #   混合过强（标签近乎随机化），改 0.3。
                                            #   手稿需同步修订。

# ==================== 模型配置 ====================
model:
  name:                                     # 模型名称
  use_target: False                         # 是否使用目标

# ==================== 训练配置 ====================
train:
  enabled: True                             # 是否训练
  epochs: 40                                # 手稿 §3.6.4: 40 epochs
  device: "cuda:0"                          # 设备配置
  learning_rate: 0.0001                     # 手稿 §3.6.4: lr = 1e-4（bptnet.yml 带 * 者优先）
  weight_decay: 0.0001                      # 手稿 §3.6.4: weight decay = 1e-4
  optimizer: "Adam"                         # 手稿 §3.6.4: Adam
  scheduler: "ReduceLROnPlateau"            # 手稿 §3.6.4
  warmup_epochs: 0                          # 手稿只声明 ReduceLROnPlateau，无 warmup
  gradient_clip: 1.0                        # 梯度裁剪
  # 早停策略（基于折内验证集 val UF1）
  # 手稿 §3.6.4: "For each fold, T = 40 epochs are run and the best validation
  # UF1 is recorded" → 跑满 40 epochs，再由 val UF1 选 best epoch 的权重。
  # val 只有几十个样本，开启早停会导致训练过早终止（实测 best 在 epoch 4、
  # 却在 epoch 14 早停），故按手稿关闭早停。
  early_stopping:
    enabled: False                          # 关闭早停：跑满 epochs（手稿 T = 40）
    patience: 10                            # 容忍轮数（仅在 enabled=True 时生效）

# ==================== 评估/测试配置 ====================
eval:
  enabled: True                             # 是否测试
  metrics: ["UF1", "UAR", "Accuracy"]       # 评估指标
  confusion_matrix: True                    # 是否计算混淆矩阵
  per_class_metrics: True                   # 是否计算每类指标

# ==================== 交叉验证配置 ====================
cross_val:
  enabled: False                            # 是否启用交叉验证
  method: "LOSO"                            # 交叉验证方法: LOSO/KFold
  folds: 5                                  # K折交叉验证的K值
  save_fold_results: True                   # 保存每折结果

# ==================== 日志配置 ====================
log:
  level: "INFO"                             # 日志级别: DEBUG/INFO/WARNING/ERROR
  log_dir: "log"                           # 日志目录
  save_interval: 10                         # 保存间隔（每N个epoch）
  print_interval: 10                        # 打印间隔（每N个batch）
  # TensorBoard支持
  tensorboard:
    enabled: False                          # 是否启用TensorBoard
    log_dir: "runs"                         # TensorBoard日志目录

# ==================== 可视化配置 ====================
visualization:
  plot_training_curve: True                 # 绘制训练曲线
  plot_confusion_matrix: True               # 绘制混淆矩阵
  plot_per_class_accuracy: True             # 绘制每类准确率
  save_figures: True                        # 保存图片
  figure_dir: "figures"                     # 图片保存目录

# ==================== 标识配置 ====================
flag:
  id: "0"                                   # ID，用于标识当前实验，每次都可以不一样
  eval: "train"                             # 评估标识：训练
  train_flag: "1"                           # 训练标记，用于标识当前实验所属批次